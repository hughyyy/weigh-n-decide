[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weigh-n-decide"
version = "0.1.0"
description = "MCP server for executing decision models (weighted criteria over alternatives), vision decision models, and literal condition evaluation"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2",
    "httpx>=0.27",
]

[project.scripts]
weigh-n-decide = "weigh_n_decide.server:main"

[tool.setuptools.packages.find]
where = ["src"]